<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PN & PDC Collections</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#13233F;--ink:#1A2230;--ink2:#4A5568;--ink3:#7A8699;--bg:#EEF1F5;--line:#D5DCE6;--soft:#E2E7EE;
  --blue:#2F6FD6;--bsoft:#E6EEFB;--red:#C2362F;--rsoft:#FBE7E5;--green:#1E8E5A;--gsoft:#E3F3EA;--amber:#B97C0A;--asoft:#FBF1DC;--r:8px;
  --card:#FFFFFF;--head:#F5F7FA;--hover:#F7F9FC;--det:#FAFBFD;--sel:#13233F;--hdr:#13233F;color-scheme:light}
:root[data-theme="dark"]{--navy:#0B1526;--ink:#E6EAF1;--ink2:#B3BDCC;--ink3:#8592A6;--bg:#0F1724;--line:#2A3547;--soft:#222C3B;
  --blue:#6EA0F2;--bsoft:#1D2E4D;--red:#F07C74;--rsoft:#3A1F22;--green:#5CC290;--gsoft:#173328;--amber:#E2B24E;--asoft:#3A2E14;
  --card:#172131;--head:#1C2738;--hover:#1D293B;--det:#131C2A;--sel:#3B5B9A;--hdr:#0B1526;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans","Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{background:var(--hdr);color:#fff}
header .hd{display:flex;align-items:baseline;gap:12px;padding-top:9px;padding-bottom:4px;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:700}
header p{margin:0;color:#B9C6DD;font-size:12.5px;flex:1;text-align:left}
.bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar .wrap{padding-top:8px;padding-bottom:8px}
.bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .row.per{margin-top:7px;gap:6px}
.seg button{padding:5px 16px!important}
.bar select,.bar input{padding:5px 9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 20px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--sel);color:#fff}
select,input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--card);max-width:100%}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.p{background:var(--blue);border-color:var(--blue);color:var(--card)}
.btn.xs{padding:2px 9px;font-size:11.5px;font-weight:500;margin-left:4px}
th select.gf{-webkit-appearance:none;appearance:none;border:0;background:transparent;font-weight:600;font-size:12px;color:var(--ink2);padding:0 2px;cursor:pointer}
.split{display:block;font-size:11px;color:var(--ink3);font-weight:400}
.btn.xs.p{color:var(--card)}
.mo.all{border-style:dashed}
.mo.all.on{border-style:solid}
.months,.weeks{display:flex;gap:5px;flex-wrap:wrap}
.months{margin-top:7px}
.weeks:not(:empty){margin-top:6px;padding:6px 0 0 10px;border-top:1px dashed var(--line)}
.cotabs{display:flex;gap:4px;padding-top:2px}
.cotabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:#B9C6DD;padding:7px 18px 8px;cursor:pointer;display:flex;align-items:baseline;gap:8px;font-size:14px;border-radius:6px 6px 0 0}
.cotabs button span{font-size:12px;font-weight:400}
.cotabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
.cotabs button.on{color:#fff;border-bottom-color:#6EA0F2;background:rgba(255,255,255,.1)}
@media (max-width:520px){.cotabs button span{display:none}.cotabs button{flex:1;justify-content:center}}
.mo{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 11px;font-size:12.5px;cursor:pointer;font-weight:500}
.mo.on{background:var(--sel);border-color:var(--sel);color:#fff}
.wk{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 11px;font-size:12.5px;cursor:pointer;font-weight:500}
.wk{min-width:78px;text-align:center}
.wk.now:not(.on){border-color:var(--blue);color:var(--blue)}
.wk.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--bsoft)}
.sumline{margin-left:auto;display:flex;align-items:baseline;gap:8px}
.sumline span{color:var(--ink2);font-size:12.5px}
.sumline b{font-size:20px;font-weight:700}
.reps{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.rp{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:2px 10px;cursor:pointer;font-size:12px}
.rp.on{background:var(--sel);border-color:var(--sel);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--head);color:var(--ink2);font-size:12px;font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
.r{text-align:right;white-space:nowrap}
.nw{white-space:nowrap}
tr.cu{cursor:pointer}
tr.cu:hover td{background:var(--hover)}
tr.cu.open td{background:var(--bsoft)}
.cname{font-weight:600;position:relative;display:inline-block}
.sub{display:block;font-size:11.5px;color:var(--ink3)}
.chev{color:var(--ink3);display:inline-block;width:14px}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.t-late{background:var(--rsoft);color:var(--red)} .t-due{background:var(--bsoft);color:var(--blue)} .t-paid{background:var(--gsoft);color:var(--green)} .t-up{background:var(--soft);color:var(--ink2)} .t-grp{background:var(--asoft);color:var(--amber)}
.tip{display:none;position:absolute;left:0;top:100%;margin-top:6px;z-index:30;background:#13233F;border:1px solid var(--line);color:#fff;border-radius:6px;padding:8px 10px;font-weight:400;font-size:12.5px;white-space:nowrap;box-shadow:0 6px 20px rgba(19,35,63,.25)}
.tip div{padding:1px 0}
.cname:hover .tip{display:block}
tr.det>td{background:var(--det);padding:6px 10px 12px 34px}
tr.det table{font-size:12.5px;background:var(--card);border:1px solid var(--soft)}
tr.det th{background:var(--card)}
tr.tot td{background:var(--head);font-weight:700}
.empty{padding:22px;text-align:center;color:var(--ink2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
footer{color:var(--ink3);font-size:12px;padding-bottom:24px;text-align:center}
#print{display:none}
.theme{background:transparent;border:1px solid #3B5180;color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.theme:hover{border-color:#fff}
@media(max-width:600px){.sumline{margin-left:0;width:100%}.bar{position:static}}
@media print{:root{--card:#fff;--head:#E9EDF3;--ink:#000;--line:#C9D1DC}}
@media print{
  @page{size:A4 landscape;margin:12mm 10mm 14mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:9px}}
  body{background:#fff} body>*:not(#print){display:none!important}
  #print{display:block;font-size:10px}
  #print h1{font-size:16px;margin:0 0 2px} #print p{margin:0 0 6px;color:#333}
  #print table{font-size:9.5px} #print th{font-size:10px;color:#222;background:#E9EDF3!important;border:1px solid #C9D1DC;padding:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print td{border:1px solid #DDE3EA;padding:3px 4px} #print tr{break-inside:avoid}
  #print tr.tot td{background:#EEF2F7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const DAY = 864e5, pd = s => s ? new Date(s + 'T00:00:00') : null, add = (d,n) => new Date(d.getTime() + n*DAY);
const ASOF = pd(D.asof);
D.ins.forEach(i => i.m = pd(i.mat));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const money = v => (v < 0 ? '-' : '') + nf.format(Math.round(Math.abs(v||0)));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd = d => d ? String(d.getDate()).padStart(2,'0') + '-' + MON[d.getMonth()] + '-' + d.getFullYear() : '—';
const fds = d => d.getDate() + ' ' + MON[d.getMonth()];
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const sum = (a,f) => a.reduce((t,x) => t + (+f(x)||0), 0);
const uniq = a => [...new Set(a)];
const ODN = [[1,6,'Overdue < 1 week'],[7,13,'Overdue 1 week'],[14,20,'Overdue 2 weeks'],[21,29,'Overdue 3 weeks'],[30,59,'Overdue 1+ month'],[60,89,'Overdue 2+ months'],[90,1e9,'Overdue 3+ months']];
const odNote = d => (ODN.find(b => d >= b[0] && d <= b[1]) || [0,0,''])[2];
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('on'), 1600); }
async function copy(t){ try { await navigator.clipboard.writeText(t); } catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } toast('Copied'); }

const last = D.ins.filter(i => i.m && i.rem > 0).reduce((m,i) => i.m > m ? i.m : m, add(ASOF, 56));
const mk = d => d.getFullYear() + '-' + d.getMonth();
const TWE = add(ASOF,6);   /* this week = report Sunday + 6 days, includes overdue */
const MONTHS = []; for (let d = new Date(ASOF.getFullYear(), ASOF.getMonth(), 1); d <= last; d = new Date(d.getFullYear(), d.getMonth()+1, 1)){
  const y = d.getFullYear(), mo = d.getMonth(), end = new Date(y, mo+1, 0), cur = ASOF.getMonth() === mo && ASOF.getFullYear() === y;
  const weeks = cur ? [{k:iso(ASOF), s:ASOF, e:TWE, label:'This week', cur:true}] : [];
  [[1,7],[8,14],[15,21],[22,end.getDate()]].forEach(([a,b],n) => { const ws = new Date(y,mo,a), we = new Date(y,mo,b), s2 = ws > TWE ? ws : add(TWE,1);
    if (s2 <= we) weeks.push({k:iso(s2), s:s2, e:we, label:'Week ' + (n+1), cur:false}); });
  MONTHS.push({k: y + '-' + mo, y, mo, f: new Date(y,mo,1), l: end, cur, label: MON[mo] + ' ' + y, weeks});
}
const S = {co:'PPSA', rep:'', q:'', week: iso(ASOF), month: mk(ASOF), view: 'week', grp: '', open: new Set()};

document.querySelectorAll('#co button').forEach(b => b.onclick = () => { S.co = b.dataset.co; S.rep = ''; S.grp = ''; S.open.clear(); render(); });
document.getElementById('q').oninput = e => { S.q = e.target.value.trim(); render(); };

/* period: current week includes overdue; future week/month = only maturities inside it */
function per(){
  if (S.view === 'all') return {kind:'all', s:ASOF, e:null, cur:true};
  const mo = MONTHS.find(m => m.k === S.month) || MONTHS[0];
  if (S.view === 'month') return {kind:'month', s: mo.cur ? ASOF : (mo.f > TWE ? mo.f : add(TWE,1)), e: mo.l, cur: mo.cur, mo};
  const w = mo.weeks.find(x => x.k === S.week) || mo.weeks[0];
  return {kind:'week', s:w.s, e:w.e, cur:w.cur, wk:w, mo};
}
function status(i, P){ const s = status0(i, P); if (i.m && i.rem > 0.005 && i.amt - i.rem > 0.5) s.t = 'Partial · ' + s.t; return s; }
function status0(i, P){
  if (!i.m) return {t:'No date', c:'t-up'};
  if (i.rem <= 0.005) return {t:'Cleared', c:'t-paid'};
  if (i.m < ASOF) return {t: odNote(Math.round((ASOF - i.m)/DAY)), c:'t-late'};   /* overdue = as of report date only */
  if (P.cur && P.e && i.m <= P.e) return {t: P.kind === 'month' ? 'Due this month' : 'Due this week', c:'t-due'};
  if (!P.cur && i.m >= P.s && i.m <= P.e) return {t: whenLbl(i.m), c:'t-due'};
  return {t: whenLbl(i.m), c:'t-up'};
}
const whenLbl = d => d <= TWE ? 'Due this week' : 'Due ' + MON[d.getMonth()] + (d.getFullYear() !== ASOF.getFullYear() ? ' ' + d.getFullYear() : '') + ' · Week ' + Math.min(4, Math.ceil(d.getDate()/7));
const base = i => i.co === S.co && (!S.rep || i.rep === S.rep) && (!S.grp || i.grp === S.grp) && (!S.q || (i.name + ' ' + i.acct).toLowerCase().includes(S.q.toLowerCase()));
const inPer = (i, P) => P.kind === 'all' || (i.m && i.rem > 0.005 && i.m <= P.e && (P.cur || i.m >= P.s));
function dueItems(P){ return D.ins.filter(i => base(i) && inPer(i, P)); }
function customers(P){
  const by = {};
  dueItems(P).forEach(i => { const k = i.co + '|' + i.acct; (by[k] = by[k] || {k, co:i.co, acct:i.acct, name:i.name, grp:i.grp, rep:i.rep, bal:i.bal, base:i.base, items:[]}).items.push(i); });
  const tw = i => i.m && i.rem > 0.005 && i.m <= TWE;
  return Object.values(by).map(c => Object.assign(c, {due: sum(P.kind === 'all' ? c.items.filter(tw) : c.items, i => i.rem), val: sum(D.ins.filter(i => i.co === c.co && i.acct === c.acct), i => i.amt)})).sort((a,b) => b.due - a.due || b.val - a.val);
}
const wkLabel = w => fds(w) + ' – ' + fds(add(w,6)) + ' ' + add(w,6).getFullYear();

function render(){
  const P = per(), w = P.s, cs = customers(P);
  document.getElementById('sub').textContent = 'Report date Sun ' + fd(ASOF) + ' · Balances as of ' + D.arDate;
  document.querySelectorAll('#co button').forEach(b => b.classList.toggle('on', b.dataset.co === S.co));
  const reps = uniq(D.ins.filter(i => i.co === S.co).map(i => i.rep)).filter(r => r && r !== '—').sort();
  document.getElementById('reps').innerHTML = `<button class="rp ${!S.rep?'on':''}" data-r="">All reps</button>` + reps.map(r => `<button class="rp ${r===S.rep?'on':''}" data-r="${esc(r)}">${esc(r)}</button>`).join('');
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.rep = b.dataset.r; S.open.clear(); render(); });
  document.getElementById('months').innerHTML = `<button class="mo all ${S.view==='all'?'on':''}" data-all="1">All periods</button>` + MONTHS.map(m => `<button class="mo ${S.view!=='all' && S.month===m.k?'on':''}" data-m="${m.k}">${m.label}</button>`).join('');
  const mo = MONTHS.find(m => m.k === S.month) || MONTHS[0];
  document.getElementById('weeks').innerHTML = S.view === 'all' ? '' : `<button class="wk ${S.view==='month'?'on':''}" data-wm="1" title="${fds(mo.f)} – ${fds(mo.l)} ${mo.y}">Whole month</button>` + mo.weeks.map(x => `<button class="wk ${S.view==='week' && x.k===S.week?'on':''}${x.cur?' now':''}" data-w="${x.k}" title="${fds(x.s)} – ${fds(x.e)} ${x.e.getFullYear()}">${x.label}</button>`).join('');
  document.querySelector('[data-all]').onclick = () => { S.view = 'all'; render(); };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.month = b.dataset.m; S.view = 'month'; S.week = MONTHS.find(x => x.k === S.month).weeks[0].k; render(); });
  const wm = document.querySelector('[data-wm]'); if (wm) wm.onclick = () => { S.view = 'month'; render(); };
  document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { S.view = 'week'; S.week = b.dataset.w; render(); });

  const A = S.view === 'all', NC = 7;
  document.getElementById('dh').textContent = A ? 'Due this week' : 'Due';
  let h = '';
  cs.forEach(c => {
    const open = S.open.has(c.k);
    const tip = (c.items.filter(i => i.rem > 0.005).length ? '' : '<div>All settled per balance</div>') + c.items.filter(i => i.rem > 0.005).sort((a,b) => (a.m||0) - (b.m||0)).map(i => `<div>${i.typ} ${esc(i.ref || '—')} · ${fd(i.m)} · <b>${money(i.rem)}</b> · ${status(i,P).t}</div>`).join('');
    h += `<tr class="cu ${open?'open':''}" data-k="${esc(c.k)}">
      <td><span class="chev">${open?'▾':'▸'}</span><span class="cname">${esc(c.name)}<span class="tip">${tip}</span></span><span class="sub" style="padding-left:14px">${esc(c.acct)}</span></td>
      <td>${c.grp === 'Individual' ? '<span class="sub">Individual</span>' : `<span class="tag t-grp">${esc(c.grp)}</span>`}</td>
      <td>${esc(c.rep)}</td><td class="r">${money(c.bal)}</td><td class="r">${money(c.val)}</td><td class="r"><b>${money(c.due)}</b>${splitTxt(c.items)}</td>
      <td class="r nw"><button class="btn xs" data-cc="${esc(c.k)}">Copy</button><button class="btn xs p" data-cp="${esc(c.k)}">PDF</button></td></tr>`;
    if (open){
      const all = (P.cur ? D.ins.filter(i => i.co === c.co && i.acct === c.acct) : c.items).slice().sort((a,b) => (a.m||0) - (b.m||0));   /* future periods: only that period's due items */
      h += `<tr class="det"><td colspan="${NC}">${c.grp !== 'Individual' ? `<div class="sub" style="margin-bottom:6px">Group ${esc(c.grp)} balance: ${money(c.base)}</div>` : ''}
        <table><thead><tr><th>Type</th><th>No.</th><th>Maturity</th><th class="r">Amount</th><th class="r">Due</th><th>Status</th></tr></thead><tbody>
        ${all.map(i => { const s = status(i,P); return `<tr><td>${i.typ}</td><td class="nw">${esc(i.ref || '—')}</td><td class="nw">${fd(i.m)}</td><td class="r">${money(i.amt)}</td><td class="r"><b>${money(i.rem)}</b></td><td><span class="tag ${s.c}">${s.t}</span></td></tr>`; }).join('')}
        </tbody></table></td></tr>`;
    }
  });
  document.getElementById('tb').innerHTML = cs.length ? h + `<tr class="tot"><td colspan="4">Total</td><td class="r">${money(sum(cs,c=>c.val))}</td><td class="r">${money(sum(cs,c=>c.due))}${splitTxt(cs.flatMap(c=>c.items))}</td><td></td></tr>` : `<tr><td colspan="${NC}" class="empty">Nothing due</td></tr>`;
  const groups = uniq(D.ins.filter(i => i.co === S.co && (!S.rep || i.rep === S.rep) && inPer(i, P)).map(i => i.grp).concat(S.grp ? [S.grp] : [])).sort((a,b) => a==='Individual' ? 1 : b==='Individual' ? -1 : a.localeCompare(b));
  document.getElementById('gh').innerHTML = `<select class="gf" id="gf" aria-label="Filter group"><option value="">Group</option>${groups.map(g => `<option ${g===S.grp?'selected':''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select><span style="color:var(--blue);pointer-events:none">▾</span>`;
  document.getElementById('gf').onchange = e => { S.grp = e.target.value; render(); };
  document.querySelectorAll('[data-cc]').forEach(b => b.onclick = e => { e.stopPropagation(); copy(msg(cs.find(c => c.k === b.dataset.cc), P)); });
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = e => { e.stopPropagation(); printCust(cs.find(c => c.k === b.dataset.cp), P); });
  document.querySelectorAll('tr.cu').forEach(tr => tr.onclick = () => { const k = tr.dataset.k; S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); });
}
function splitTxt(items){ const pn = sum(items.filter(i => i.typ === 'PN'), i => i.rem), pdc = sum(items.filter(i => i.typ === 'PDC'), i => i.rem);
  return ''; }
const period = P => P.kind === 'all' ? 'All periods (as of ' + fd(ASOF) + ')' : P.kind === 'month' ? 'Month ' + P.mo.label : (P.cur ? 'This week ' : P.wk.label + ' ' + P.mo.label + ' ') + '(' + fds(P.s) + ' – ' + fds(P.e) + ')';
function custItems(c){ return c.items.slice().sort((a,b) => (a.m||0) - (b.m||0)); }
const plbl = P => P.kind === 'all' ? 'All periods' : P.kind === 'month' ? P.mo.label : (P.cur ? 'This week' : P.wk.label + ' ' + P.mo.label) + ' (' + fds(P.s) + ' – ' + fds(P.e) + ')';
const dueL = P => P.kind === 'all' ? 'Due this week' : 'Due';
const sd = d => d ? String(d.getDate()).padStart(2,'0') + '-' + MON[d.getMonth()] + '-' + String(d.getFullYear()).slice(2) : '—';
const rows = (c, P) => custItems(c).filter(i => i.rem > 0.005).map(i => ({no: i.ref || '—', typ: i.typ, d: sd(i.m), due: money(i.rem), st: status(i,P).t}));
function msg(c, P){
  const r = rows(c, P), H = {no:'No.', typ:'Type', d:'Date', due:'Due', st:'Status'}, K = ['no','typ','d','due','st'];
  const W = Object.fromEntries(K.map(k => [k, Math.max(H[k].length, ...r.map(x => x[k].length))]));
  const line = x => K.map(k => k === 'due' ? x[k].padStart(W[k]) : x[k].padEnd(W[k])).join('  ').trimEnd();
  return `${c.co} – ${plbl(P)}
${c.name} (${c.acct}) – Rep: ${c.rep}
Balance: ${money(c.bal)} | ${dueL(P)}: ${money(c.due)} SAR

` + '```\n' + [line(H), ...r.map(line)].join('\n') + '\n```';
}
function printCust(c, P){
  const inP = new Set(c.items.map(i => i.id));
  const all = D.ins.filter(i => i.co === c.co && i.acct === c.acct).sort((a,b) => (a.m||0) - (b.m||0));   /* all PN/PDC of the customer */
  document.getElementById('print').innerHTML = `<h1>${esc(c.name)} (${esc(c.acct)}) – ${c.co}</h1><p>${plbl(P)} · Group ${esc(c.grp)} · Rep ${esc(c.rep)} · Balance SAR ${money(c.bal)} · PN/PDC value SAR ${money(c.val)} · ${dueL(P)} SAR ${money(c.due)} · Balances as of ${D.arDate}</p>
   <table style="width:auto"><thead><tr><th>No.</th><th>Type</th><th>Maturity</th><th>Amount</th><th>Due</th><th>Status</th></tr></thead><tbody>
   ${all.map(i => `<tr${P.kind !== 'all' && inP.has(i.id) ? ' style="font-weight:700"' : ''}><td>${esc(i.ref||'—')}</td><td>${i.typ}</td><td class="nw">${fd(i.m)}</td><td class="r">${money(i.amt)}</td><td class="r">${money(i.rem)}</td><td>${status(i,P).t}</td></tr>`).join('')}
   <tr class="tot"><td colspan="3">Total</td><td class="r">${money(sum(all,i=>i.amt))}</td><td class="r">${money(sum(all,i=>i.rem))}</td><td></td></tr></tbody></table>
   ${P.kind !== 'all' ? `<p style="margin-top:6px">Bold rows = due in this period (${money(c.due)}).</p>` : ''}`;
  setTimeout(() => window.print(), 50);
}
(function(){
  const root = document.documentElement, btn = document.getElementById('theme');
  let t = null; try { t = localStorage.getItem('pnpdc-theme'); } catch(e){}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const apply = v => { root.setAttribute('data-theme', v); btn.textContent = v === 'dark' ? 'Light' : 'Dark'; try { localStorage.setItem('pnpdc-theme', v); } catch(e){} };
  apply(t); btn.onclick = () => apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
})();
render();
