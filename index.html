<style>
  :root{
    --navy:#122444;
    --ink:#181D28; --sub:#5B647A; --muted:#8B93A6;
    --line:#E3E6ED; --bg:#F3F4F7; --card:#FFFFFF; --card-alt:#F8F9FB; --zebra:#FBFCFD;
    --blue:#2B6CB0; --amber:#B4790E;
    --seal:#A83A2E; --red:#A83A2E; --red-bg:#FBEAE7; --red-line:#EFC5BC;
    --green:#2C6B4C; --green-bg:#E9F2EC; --green-line:#C9DFD1;
    --chart-grid:#EBEDF2; --chart-text:#5B647A;
    --font-serif:'Source Serif 4', Georgia, serif;
  }
  html[data-theme="dark"]{
    --navy:#0A1220;
    --ink:#E7E9F0; --sub:#A0A8BD; --muted:#6E7690;
    --line:#242C40; --bg:#0A0D14; --card:#121826; --card-alt:#0E1420; --zebra:#161C2B;
    --blue:#6CA2E0; --amber:#E0A83E;
    --seal:#D97C6E; --red:#D97C6E; --red-bg:#2A1616; --red-line:#5A2C26;
    --green:#7FCBA6; --green-bg:#122420; --green-line:#264A3C;
    --chart-grid:#232B3D; --chart-text:#A0A8BD;
  }
  *{box-sizing:border-box;}
  *:focus-visible{outline:2px solid var(--seal);outline-offset:2px;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;transition:background .15s,color .15s;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 64px;}

  header.top{background:var(--navy);color:#fff;padding:18px 0 0;}
  header.top .row1{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  header.top .title-group{display:flex;align-items:center;gap:12px;}
  header.top h1{font-family:var(--font-serif);font-size:21px;font-weight:600;margin:0;letter-spacing:.1px;}
  .brand-badge{background:#fff;border-radius:8px;padding:4px 8px;display:flex;align-items:center;height:38px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .brand-badge img{height:30px;width:auto;display:block;border-radius:4px;}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,.16);}

  .nav-tabs{display:flex;gap:6px;margin-top:16px;}
  .nav-tabs button{
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;padding:9px 18px;border-radius:8px 8px 0 0;
    border:1px solid transparent;background:transparent;color:#AEB7CC;cursor:pointer;
  }
  .nav-tabs button.active{background:var(--card);color:var(--ink);}

  .toolbar{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;}
  .tb-group{display:flex;align-items:center;gap:8px;}
  .tb-label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;}
  .segmented{display:inline-flex;background:var(--card-alt);border:1px solid var(--line);border-radius:8px;padding:2px;}
  .segmented button{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:6px 14px;border-radius:6px;border:none;background:transparent;color:var(--sub);cursor:pointer;}
  .segmented button.active{background:var(--navy);color:#fff;}
  .segmented button.credit-active{background:var(--red);color:#fff;}
  html[data-theme="dark"] .segmented button.active{background:#2E4470;color:#fff;}
  html[data-theme="dark"] .segmented button.credit-active{background:#8A3B32;color:#fff;}
  html[data-theme="dark"] .nav-tabs button.active{background:var(--card);color:#fff;}
  select{font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card-alt);color:var(--ink);}
  .btn.reset{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--card-alt);color:var(--sub);}
  .btn.reset:hover{background:var(--bg);}
  .status-line{font-size:12.5px;color:var(--sub);padding:2px 2px 10px;}
  .status-line b{color:var(--ink);font-weight:600;}

  section.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin:20px 0;}
  section.panel h2{font-family:var(--font-serif);font-size:17px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  section.panel .panel-sub{font-size:12px;color:var(--sub);margin:0 0 16px;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .panel-head .panel-sub{margin-bottom:16px;}
  .segmented.mini button{padding:5px 12px;font-size:12px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:860px){.grid-2{grid-template-columns:1fr;}}
  canvas{max-width:100%;}
  .chart-box{position:relative;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:var(--card-alt);}
  th{text-align:left;font-weight:600;color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;}
  th:hover{color:var(--ink);}
  th.nosort{cursor:default;}
  th .arrow{font-size:10px;color:var(--seal);margin-inline-start:3px;}
  td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top;}
  tbody tr:nth-child(even){background:var(--zebra);}
  tbody tr:hover{background:var(--card-alt);}
  td.num, th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;}
  td.name{white-space:normal;min-width:200px;font-weight:500;line-height:1.35;}
  td.note{white-space:normal;color:var(--sub);font-size:12px;min-width:130px;}
  .neg{color:var(--red);}
  .pos-note{color:var(--green);}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
  .table-scroll table{font-size:12.5px;}
  .total-row{font-weight:600;background:var(--card-alt);}
  .total-row td{border-top:2px solid var(--sub);border-bottom:none;color:var(--ink);}
  .subtotal-row{background:var(--zebra);font-weight:500;color:var(--sub);}
  .subtotal-row td{border-bottom:1px solid var(--line);}
  td.dim{color:var(--sub);font-size:12px;}
  td.strong{font-weight:600;}
  .zero{color:var(--muted);}
  th.sep, td.sep{border-left:1px solid var(--line);}
  .detail-table td.name{position:sticky;left:0;background:var(--card);z-index:1;}
  .detail-table tbody tr:nth-child(even) td.name{background:var(--zebra);}
  .detail-table tbody tr:hover td.name{background:var(--card-alt);}
  .detail-table .total-row td:first-child{position:sticky;left:0;background:var(--card-alt);z-index:1;}
  #maturitySchoolTable td.name{vertical-align:top;font-weight:600;color:var(--ink);border-right:1px solid var(--line);}
  #maturitySchoolTable tbody tr{border-bottom:none;}
  #maturitySchoolTable .school-start td{border-top:1px solid var(--line);}
  #maturitySchoolTable tbody tr:nth-child(even){background:transparent;}
  .table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .table-toolbar input[type=text]{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:220px;}
  .row-count{font-size:12px;color:var(--sub);}

  .details-block{margin-top:4px;}
  .details-block summary{
    list-style:none;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--blue);
    padding:6px 0;display:inline-flex;align-items:center;gap:6px;user-select:none;
  }
  .details-block summary::-webkit-details-marker{display:none;}
  .details-block summary::before{content:'▸';font-size:10px;color:var(--muted);transition:transform .12s;}
  .details-block[open] summary::before{transform:rotate(90deg);}
  .details-block[open] summary{margin-bottom:10px;}
  .details-block summary:hover{color:var(--navy);}
  html[data-theme="dark"] .details-block summary:hover{color:#fff;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .kpi{background:var(--card-alt);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .kpi .label{font-size:12px;color:var(--sub);margin-bottom:6px;}
  .kpi .value{font-size:22px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .kpi .value.accent{color:var(--red);}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .note-strip{font-size:12px;color:var(--sub);background:var(--card-alt);border:1px dashed var(--line);border-radius:8px;padding:12px 16px;margin-top:16px;}
  footer{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px;padding:24px 0;border-top:1px solid var(--line);}

  /* Notes page */
  .notes-banner{font-size:12px;color:var(--sub);background:var(--card-alt);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;}
  .notes-actions{display:flex;gap:8px;}
  .btn.small{font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;}
  .btn.small:hover{background:var(--card-alt);}
  .school-row{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .school-row.excluded{opacity:.5;}
  .school-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .school-name{font-weight:500;font-size:13.5px;}
  .school-meta{font-size:11.5px;color:var(--sub);}
  .school-figs{display:flex;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .school-figs div span{display:block;font-family:'Inter';font-size:10.5px;color:var(--sub);}
  .include-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);white-space:nowrap;}
  .add-collection-form{display:none;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap;}
  .add-collection-form.open{display:flex;}
  .add-collection-form input{font-family:inherit;font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .collections-list{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .collection-chip{display:flex;justify-content:space-between;align-items:center;font-size:12px;background:var(--card-alt);border:1px solid var(--line);border-radius:6px;padding:4px 10px;}
  .collection-chip button{border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;line-height:1;}
  .school-memo{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .memo-text{font-size:12.5px;color:var(--ink);background:var(--card-alt);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;white-space:pre-wrap;}
  .memo-form{display:none;flex-direction:column;gap:6px;margin-top:6px;}
  .memo-form.open{display:flex;}
  .memo-form textarea{font-family:inherit;font-size:12.5px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical;width:100%;}

  /* Print / PDF export */
  @media print{
    :root, html[data-theme="dark"]{
      --navy:#122444; --ink:#181D28; --sub:#5B647A; --muted:#8B93A6;
      --line:#E3E6ED; --bg:#FFFFFF; --card:#FFFFFF; --card-alt:#F8F9FB; --zebra:#FBFCFD;
      --blue:#2B6CB0; --amber:#B4790E;
      --seal:#A83A2E; --red:#A83A2E; --red-bg:#FBEAE7; --red-line:#EFC5BC;
      --green:#2C6B4C; --green-bg:#E9F2EC; --green-line:#C9DFD1;
      --chart-grid:#EBEDF2; --chart-text:#5B647A;
    }
    body{background:#fff;}
    .wrap{max-width:100%;padding:0 8px;}
    header.top{background:#fff !important;color:var(--ink);padding:0 0 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    header.top h1{color:var(--ink);}
    header.top .icon-btn, .icon-btn{display:none !important;}
    .nav-tabs, .toolbar, .btn.reset, #resetBtn{display:none !important;}
    .status-line{padding:6px 2px 12px;}
    section.panel{break-inside:avoid;border:1px solid var(--line);box-shadow:none;margin:0 0 14px;}
    .chart-box{break-inside:avoid;}
    table{font-size:11px;}
    thead{display:table-header-group;}
    tr{break-inside:avoid;}
    .table-scroll{overflow:visible;border:1px solid var(--line);}
    .details-block summary::before{display:none;}
    .add-collection-form, .memo-form, .school-row .btn.small, .notes-actions, .include-toggle input, .collection-chip button{display:none !important;}
    .notes-banner{display:none;}
    a{color:var(--ink);text-decoration:none;}
    footer{border-top:1px solid var(--line);margin-top:8px;}
    @page{margin:14mm 12mm;}
  }
</style>
</head>

const BUCKET_KEYS = ["b1_60","b61_120","b121_180","b181_240","b240p"];
const BUCKET_LABELS = ["1-60","61-120","121-180","181-240","240+"];
const BUCKET_ORDER_OLDEST_FIRST = ["b240p","b181_240","b121_180","b61_120","b1_60"];
const BUCKET_COLORS_LIGHT = ["#93C5FD","#60A5FA","#FCD34D","#F0A93E","#A83A2E"];
const BUCKET_COLORS_DARK  = ["#5C86B8","#6CA2E0","#C99A3E","#D9922E","#D97C6E"];

const fmt = n => Math.round(n).toLocaleString('en-US');
const fmtSigned = n => (n<0 ? '(' + Math.abs(Math.round(n)).toLocaleString('en-US') + ')' : Math.round(n).toLocaleString('en-US'));
const fmtK = n => (n<0?'-':'') + Math.round(Math.abs(n)/1000).toLocaleString('en-US') + 'K';
const MONTH_LABELS = {"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"};
const fmtMonth = ym => { const [y,m]=ym.split('-'); return MONTH_LABELS[m]+" '"+y.slice(2); };
const fmtDate = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+' '+MONTH_LABELS[m]+' '+y; };

// ---------- persistence ----------
function loadNotes(){
  try{ return JSON.parse(localStorage.getItem('arNotes_v1')) || {}; }catch(e){ return {}; }
}
function saveNotes(notes){ try{ localStorage.setItem('arNotes_v1', JSON.stringify(notes)); }catch(e){} }
let NOTES = loadNotes();
function getNote(company, account){
  NOTES[company] = NOTES[company] || {};
  if(!NOTES[company][account]) NOTES[company][account] = { included:true, collections:[], memo:"" };
  if(NOTES[company][account].memo === undefined) NOTES[company][account].memo = "";
  return NOTES[company][account];
}
function setIncluded(company, account, val){ getNote(company,account).included = val; saveNotes(NOTES); }
function addCollection(company, account, entry){ getNote(company,account).collections.push(entry); saveNotes(NOTES); }
function removeCollection(company, account, idx){ getNote(company,account).collections.splice(idx,1); saveNotes(NOTES); }
function setMemo(company, account, text){ getNote(company,account).memo = text; saveNotes(NOTES); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function waterfallReduce(row, amount){
  const b = {}; BUCKET_KEYS.forEach(k=>b[k]=row[k]||0);
  let remaining = Math.abs(amount);
  BUCKET_ORDER_OLDEST_FIRST.forEach(k=>{
    const take = Math.min(remaining, Math.abs(b[k]));
    const sign = b[k] < 0 ? -1 : 1;
    b[k] = b[k] - sign*take;
    remaining -= take;
  });
  return b;
}

function effectiveDebitRows(company){
  return DATA[company].debit.map(row=>{
    const note = getNote(company, row.account);
    const collTotal = note.collections.reduce((s,c)=>s + (parseFloat(c.amount)||0), 0);
    const adjBuckets = collTotal > 0 ? waterfallReduce(row, collTotal) : { b1_60:row.b1_60,b61_120:row.b61_120,b121_180:row.b121_180,b181_240:row.b181_240,b240p:row.b240p };
    const adjBalance = Math.max(row.balance - collTotal, 0);
    return { ...row, ...adjBuckets, balance: adjBalance, rawBalance: row.balance, collectionsTotal: collTotal, included: note.included };
  });
}

// ---------- helpers ----------
function theme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
function bucketColors(){ return theme()==='dark' ? BUCKET_COLORS_DARK : BUCKET_COLORS_LIGHT; }
function chartAccent(name){
  const light = {green:'#2C6B4C', amber:'#B4790E', red:'#A83A2E', blue:'#2B6CB0', teal:'#0F9D8C'};
  const dark  = {green:'#7FCBA6', amber:'#E0A83E', red:'#D97C6E', blue:'#6CA2E0', teal:'#3FC7B4'};
  return (theme()==='dark'?dark:light)[name];
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function uniqueSorted(arr){ return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b)); }

function matchesFilter(row){
  const groupOk = state.group==='all' || row.group === state.group;
  const repOk = state.rep==='all' || (row.rep||'').toLowerCase() === state.rep.toLowerCase();
  return groupOk && repOk;
}
function currentDebitRows(){ return effectiveDebitRows(state.company).filter(r=>r.included); }
function currentCreditRows(){ return DATA[state.company].credit; }
function currentRows(){ return state.balanceType==='debit' ? currentDebitRows() : currentCreditRows(); }

function sumBuckets(rows){
  const t = {b1_60:0,b61_120:0,b121_180:0,b181_240:0,b240p:0,balance:0};
  rows.forEach(r=>{ BUCKET_KEYS.forEach(k=>t[k]+=r[k]||0); t.balance += r.balance||0; });
  return t;
}
function groupByKey(rows, key){
  const map = {};
  rows.forEach(r=>{
    const k = r[key] || 'Unassigned';
    if(!map[k]) map[k] = {label:k,b1_60:0,b61_120:0,b121_180:0,b181_240:0,b240p:0,balance:0,count:0};
    BUCKET_KEYS.forEach(bk=>map[k][bk]+=r[bk]||0);
    map[k].balance += r.balance||0; map[k].count += 1;
  });
  return Object.values(map).sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance));
}
function stackedDataset(rows){
  const colors = bucketColors();
  return BUCKET_KEYS.map((k,i)=>({ label:BUCKET_LABELS[i], data: rows.map(r=>Math.round(r[k]*100)/100), backgroundColor:colors[i], stack:'s' }));
}
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

// ---------- filters ----------
function populateFilters(){
  const rows = [...DATA[state.company].debit, ...DATA[state.company].credit];
  const groups = uniqueSorted(rows.map(r=>r.group));
  const reps = uniqueSorted(rows.map(r=>r.rep));
  const gSel = document.getElementById('groupFilter'), rSel = document.getElementById('repFilter');
  gSel.innerHTML = '<option value="all">All groups</option>' + groups.map(g=>`<option value="${g}">${g}</option>`).join('');
  rSel.innerHTML = '<option value="all">All representatives</option>' + reps.map(r=>`<option value="${r}">${r}</option>`).join('');
  gSel.value = state.group; rSel.value = state.rep;
  document.getElementById('groupFilterWrap').style.display = DATA[state.company].meta.hasGroups ? '' : 'none';
}

function sectionKpi(){
  return `
  <section class="panel kpi-panel">
    <div class="kpi-grid">
      <div class="kpi"><div class="label" id="kpiTotalLabel">Total balance</div><div class="value" id="kpiTotal">—</div><div class="foot" id="kpiTotalFoot"></div></div>
      <div class="kpi"><div class="label">Aged 240+ days</div><div class="value accent" id="kpiAged">—</div><div class="foot" id="kpiAgedFoot"></div></div>
      <div class="kpi" id="kpiCoverageWrap"><div class="label">PDC/PN coverage</div><div class="value" id="kpiCoverage">—</div><div class="foot" id="kpiCoverageFoot"></div></div>
      <div class="kpi" id="kpiCollWrap"><div class="label">Subsequent collection</div><div class="value" id="kpiColl">—</div><div class="foot">Recorded manually in Data &amp; notes</div></div>
    </div>
  </section>`;
}
function renderKpi(rows, isDebit){
  const t = sumBuckets(rows);
  document.getElementById('kpiTotalLabel').textContent = isDebit ? 'Total AR balance' : 'Total credit balance';
  document.getElementById('kpiTotal').textContent = 'SAR ' + fmtSigned(t.balance);
  document.getElementById('kpiTotalFoot').textContent = rows.length + ' of ' + currentRows().length + ' ' + (isDebit?'schools':'accounts') + ' in view';
  const agedAbs = Math.abs(t.b181_240)+Math.abs(t.b240p);
  const pct = t.balance ? Math.round(agedAbs/Math.abs(t.balance)*1000)/10 : 0;
  document.getElementById('kpiAged').textContent = pct + '%';
  document.getElementById('kpiAgedFoot').textContent = 'SAR ' + fmtK(agedAbs) + ' of ' + fmtK(t.balance);
  document.getElementById('kpiCoverageWrap').style.display = isDebit ? '' : 'none';
  document.getElementById('kpiCollWrap').style.display = isDebit ? '' : 'none';
  if(isDebit){
    const totalPdcPn = rows.reduce((s,r)=>s+(r.pdc||0),0);
    const secured = rows.reduce((s,r)=>s+Math.min(r.pdc||0, Math.abs(r.balance)),0);
    const covPct = t.balance ? Math.round(secured/Math.abs(t.balance)*1000)/10 : 0;
    document.getElementById('kpiCoverage').textContent = covPct + '%';
    document.getElementById('kpiCoverageFoot').textContent = 'SAR ' + fmtK(secured) + ' secured of ' + fmtK(t.balance);
    const collTotal = rows.reduce((s,r)=>s+(r.collectionsTotal||0),0);
    document.getElementById('kpiColl').textContent = 'SAR ' + fmtK(collTotal);
  }
}

function sectionSchools(){
  return `
  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>Schools by balance</h2>
        <p class="panel-sub" id="schoolsSub">Ranked highest to lowest — aging composition and total shown per bar</p>
      </div>
      <div class="segmented mini" id="schoolsScope">
        <button data-val="top" class="${state.schoolsScope==='all'?'':'active'}">Top 12</button>
        <button data-val="all" class="${state.schoolsScope==='all'?'active':''}">All schools</button>
      </div>
    </div>
    <div class="chart-box" id="schoolsChartBox" style="height:360px;"><canvas id="schoolsChart"></canvas></div>
  </section>`;
}
function renderSchools(rows){
  const sorted = [...rows].sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance));
  const showAll = state.schoolsScope==='all';
  const list = showAll ? sorted : sorted.slice(0,12);
  const sub = document.getElementById('schoolsSub');
  if(sub) sub.textContent = showAll
    ? `Ranked highest to lowest — all ${sorted.length} schools in view, aging composition and total shown per bar`
    : `Ranked highest to lowest — the ${Math.min(12,sorted.length)} largest of ${sorted.length}, aging composition and total shown per bar`;
  destroyChart('schools');
  const grid = cssVar('--chart-grid'), text = cssVar('--chart-text');
  const h = Math.max(240, list.length*(showAll?24:30) + 70);
  document.getElementById('schoolsChartBox').style.height = h+'px';
  const labels = list.map(r=>{
    const short = r.name.length>32 ? r.name.slice(0,30)+'…' : r.name;
    return short + '  —  ' + fmtK(r.balance);
  });
  charts.schools = new Chart(document.getElementById('schoolsChart'), { type:'bar',
    data:{ labels, datasets: stackedDataset(list) },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{color:text, boxWidth:11, font:{size:11}} },
        tooltip:{ callbacks:{ label:c=>c.dataset.label+': SAR '+fmt(c.parsed.x) } } },
      scales:{ x:{ stacked:true, ticks:{callback:v=>fmtK(v),color:text}, grid:{color:grid} },
               y:{ stacked:true, grid:{display:false}, ticks:{color:text, font:{size: showAll?10.5:11.5}} } } } });
}

// ---------- PDC / PN coverage ----------
function pdcStatus(pct){
  if(pct >= 99.95) return {label:'Fully covered', cls:'pos-note'};
  if(pct > 0.05) return {label:'Partially covered', cls:''};
  return {label:'Not covered', cls:'neg'};
}
function sectionPdc(){
  return `
  <section class="panel">
    <h2>PDC / PN coverage</h2>
    <p class="panel-sub">Every school in view — how much of the balance is secured by valid (non-expired) cheques and promissory notes. Expired instruments are excluded entirely.</p>
    <div class="chart-box" id="pdcChartBox" style="height:400px;margin-bottom:16px;"><canvas id="pdcChart"></canvas></div>
    <details class="details-block">
      <summary>Show details</summary>
      <div class="table-scroll">
        <table id="pdcTable">
          <thead><tr><th>School</th><th class="num">Balance</th><th class="num">Subsequent collection</th><th class="num">PDC balance</th><th class="num">PN balance</th><th class="num">Uncovered</th><th class="num">Coverage</th><th>Status</th></tr></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </details>
  </section>`;
}
function renderPdc(rows){
  const withPdc = rows.map(r=>{
    const bal = Math.abs(r.balance);
    const pdcB = r.pdcBalance||0, pnB = r.pnBalance||0;
    const secured = Math.min(pdcB+pnB, bal), uncovered = Math.max(bal-pdcB-pnB,0);
    const pct = bal ? Math.round(secured/bal*1000)/10 : (pdcB+pnB>0?100:0);
    return {...r, secured, uncovered, pct};
  }).sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance));
  destroyChart('pdc');
  const grid = cssVar('--chart-grid'), text = cssVar('--chart-text');

    data:{ labels: withPdc.map(r=>(r.name.length>26?r.name.slice(0,24)+'…':r.name)+'  —  '+fmtK(r.balance)),
      datasets:[
        { label:'PDC', data: withPdc.map(r=>Math.round(r.pdcBalance||0)), backgroundColor: chartAccent('blue'), stack:'s' },
        { label:'PN', data: withPdc.map(r=>Math.round(r.pnBalance||0)), backgroundColor: chartAccent('teal'), stack:'s' },
        { label:'Uncovered', data: withPdc.map(r=>Math.round(r.uncovered)), backgroundColor: chartAccent('red'), stack:'s' }
      ] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{color:text, boxWidth:11, font:{size:11}} },
        tooltip:{ callbacks:{ label:c=>c.dataset.label+': SAR '+fmt(c.parsed.x) } } },
      scales:{ x:{ stacked:true, ticks:{callback:v=>fmtK(v),color:text}, grid:{color:grid} },
               y:{ stacked:true, grid:{display:false}, ticks:{color:text, font:{size:11}} } } } });
  document.querySelector('#pdcTable tbody').innerHTML = withPdc.map(r=>{
    const st = pdcStatus(r.pct);
    return `<tr><td class="name">${r.name}</td><td class="num">${fmtSigned(r.balance)}</td><td class="num">${r.collectionsTotal?fmt(r.collectionsTotal):'—'}</td><td class="num">${r.pdcBalance?fmt(r.pdcBalance):'—'}</td><td class="num">${r.pnBalance?fmt(r.pnBalance):'—'}</td><td class="num ${r.uncovered>0?'neg':''}">${fmt(r.uncovered)}</td><td class="num">${r.pct}%</td>
    <td class="${st.cls}">${st.label}</td></tr>`;
  }).join('');
  const tb = withPdc.reduce((a,r)=>a+Math.abs(r.balance),0);
  const tc = withPdc.reduce((a,r)=>a+(r.collectionsTotal||0),0);
  const tp = withPdc.reduce((a,r)=>a+(r.pdcBalance||0),0);
  const tn = withPdc.reduce((a,r)=>a+(r.pnBalance||0),0);
  const tu = withPdc.reduce((a,r)=>a+r.uncovered,0);
  document.querySelector('#pdcTable tfoot').innerHTML =
    `<tr class="total-row"><td>Total (${withPdc.length} schools)</td><td class="num">${fmt(tb)}</td><td class="num">${fmt(tc)}</td><td class="num">${fmt(tp)}</td><td class="num">${fmt(tn)}</td><td class="num ${tu>0?'neg':''}">${fmt(tu)}</td><td class="num">${tb?Math.round((tb-tu)/tb*1000)/10:0}%</td><td></td></tr>`;
}

function sectionMaturity(){
  return `
  <section class="panel">
    <h2>PDC / PN maturity schedule</h2>
    <p class="panel-sub">Cash timing from valid (non-expired) instruments for the schools currently in view. Amounts in thousands (K).</p>
    <div class="chart-box" style="height:220px;margin-bottom:16px;"><canvas id="maturityChart"></canvas></div>
    <details class="details-block">
      <summary>Show schedule by school</summary>
      <div class="table-scroll">
        <table id="maturitySchoolTable">
          <thead><tr><th>School</th><th>Due date</th><th class="num">PDC</th><th class="num">PN</th><th class="num">Total</th></tr></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </details>
    <details class="details-block">
      <summary>Show schedule by date</summary>
      <div class="table-scroll">
        <table id="maturityTable">
          <thead><tr><th>Due date</th><th class="num">PDC</th><th class="num">PN</th><th class="num">Total</th><th class="num">Running total</th><th class="num"># instruments</th></tr></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
      <div class="note-strip" id="maturityNote"></div>
    </details>
  </section>`;
}
function computeMaturity(rows){
  // rows = the filtered debit schools currently in view; match instruments by account
  const company = state.company;
  const accounts = new Set(rows.map(r=>r.account));
  const valid = INSTRUMENTS[company].filter(i=>!i.expired && i.account && accounts.has(i.account));

  // by month (for chart) + month->school (for tooltip)
  const byMonthTotal = {}, byMonthSchool = {};
  valid.forEach(i=>{
    if(!i.dueDate) return;
    const m = i.dueDate.slice(0,7);
    byMonthTotal[m] = (byMonthTotal[m]||0) + i.amount;
    byMonthSchool[m] = byMonthSchool[m] || {};
    byMonthSchool[m][i.name] = (byMonthSchool[m][i.name]||0) + i.amount;
  });
  const monthly = Object.keys(byMonthTotal).sort().map(m=>({month:m, total:byMonthTotal[m]}));
  const monthSchools = {};
  Object.keys(byMonthSchool).forEach(m=>{
    monthSchools[m] = Object.entries(byMonthSchool[m]).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total);
  });

  // by date (table) + running
  const byDate = {}; let noDate={pdc:0,pn:0,count:0};
  valid.forEach(i=>{
    if(!i.dueDate){ noDate[i.type==='PN'?'pn':'pdc']+=i.amount; noDate.count++; return; }
    byDate[i.dueDate] = byDate[i.dueDate] || {pdc:0,pn:0,count:0};
    byDate[i.dueDate][i.type==='PN'?'pn':'pdc'] += i.amount; byDate[i.dueDate].count++;
  });
  let running=0; const dateRows = Object.keys(byDate).sort().map(d=>{
    const tot = byDate[d].pdc+byDate[d].pn; running+=tot;
    return {date:d, pdc:byDate[d].pdc, pn:byDate[d].pn, total:tot, count:byDate[d].count, running};
  });
  const grand = { pdc: valid.reduce((s,i)=>s+(i.type!=='PN'?i.amount:0),0),
                  pn: valid.reduce((s,i)=>s+(i.type==='PN'?i.amount:0),0),
                  total: valid.reduce((s,i)=>s+i.amount,0), count: valid.length };

  // by school
  const schoolMap = {};
  valid.forEach(i=>{
    schoolMap[i.name] = schoolMap[i.name] || {name:i.name, rows:{}, pdc:0,pn:0,total:0,count:0};
    const k = i.dueDate || 'none';
    const sm = schoolMap[i.name];
    sm.rows[k] = sm.rows[k] || {date:i.dueDate||null, pdc:0,pn:0,total:0,count:0};
    sm.rows[k][i.type==='PN'?'pn':'pdc'] += i.amount; sm.rows[k].total += i.amount; sm.rows[k].count++;
    sm[i.type==='PN'?'pn':'pdc'] += i.amount; sm.total += i.amount; sm.count++;
  });
  const per = Object.values(schoolMap).map(s=>{
    const keys = Object.keys(s.rows).sort((a,b)=> a==='none'?1 : b==='none'?-1 : a.localeCompare(b));
    return {...s, rows: keys.map(k=>s.rows[k])};
  }).sort((a,b)=>b.total-a.total);

  return { monthly, monthSchools, dateRows, noDate, grand, per, validCount: valid.length };
}
function renderMaturity(rows){
  const company = state.company;
  const M = computeMaturity(rows);
  destroyChart('maturity');
  const grid = cssVar('--chart-grid'), text = cssVar('--chart-text');
  charts.maturity = new Chart(document.getElementById('maturityChart'), { type:'bar',
    data:{ labels: M.monthly.map(m=>fmtMonth(m.month)), datasets:[{ data: M.monthly.map(m=>Math.round(m.total)), backgroundColor: chartAccent('blue'), borderRadius:3 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ displayColors:false, padding:10, titleFont:{size:12}, bodyFont:{size:11.5},
          callbacks:{
            label: c => 'Total: SAR ' + fmt(c.parsed.y),
            afterBody: items => {
              const m = M.monthly[items[0].dataIndex].month;
              const list = M.monthSchools[m] || [];
              const shown = list.slice(0,10).map(s=>{ const n = s.name.length>34 ? s.name.slice(0,32)+'…' : s.name; return '• ' + n + ' — ' + fmtK(s.total); });
              if(list.length>10) shown.push('… +' + (list.length-10) + ' more');
              return [''].concat(shown);
            }
          } } },
      scales:{ y:{ ticks:{callback:v=>fmtK(v),color:text}, grid:{color:grid} }, x:{ grid:{display:false}, ticks:{color:text, font:{size:10.5}} } } } });

  // by school
  let sHtml = '';
  M.per.forEach(s=>{
    s.rows.forEach((r,idx)=>{
      sHtml += `<tr class="${idx===0?'school-start':''}">${idx===0?`<td class="name" rowspan="${s.rows.length + (s.rows.length>1?1:0)}">${s.name}</td>`:''}
        <td>${fmtDate(r.date)}</td><td class="num">${r.pdc?fmtK(r.pdc):'—'}</td><td class="num">${r.pn?fmtK(r.pn):'—'}</td><td class="num strong">${fmtK(r.total)}</td></tr>`;
    });
    if(s.rows.length>1){
      sHtml += `<tr class="subtotal-row"><td>Subtotal</td><td class="num">${s.pdc?fmtK(s.pdc):'—'}</td><td class="num">${s.pn?fmtK(s.pn):'—'}</td><td class="num">${fmtK(s.total)}</td></tr>`;
    }
  });
  document.querySelector('#maturitySchoolTable tbody').innerHTML = sHtml || '<tr><td colspan="5" style="color:var(--sub);">No valid instruments for the schools in view.</td></tr>';
  const sp=M.per.reduce((a,s)=>a+s.pdc,0), sn=M.per.reduce((a,s)=>a+s.pn,0), st_=M.per.reduce((a,s)=>a+s.total,0);
  document.querySelector('#maturitySchoolTable tfoot').innerHTML =
    `<tr class="total-row"><td>Grand total</td><td>${M.per.length} school${M.per.length===1?'':'s'}</td><td class="num">${fmtK(sp)}</td><td class="num">${fmtK(sn)}</td><td class="num">${fmtK(st_)}</td></tr>`;

  // by date
  let rowsHtml = '';
  if(M.noDate.count>0){
    rowsHtml += `<tr><td><em>No due date recorded</em></td><td class="num">${fmtK(M.noDate.pdc)}</td><td class="num">${fmtK(M.noDate.pn)}</td><td class="num">${fmtK(M.noDate.pdc+M.noDate.pn)}</td><td class="num">—</td><td class="num">${M.noDate.count}</td></tr>`;
  }
  rowsHtml += M.dateRows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td class="num">${fmtK(r.pdc)}</td><td class="num">${fmtK(r.pn)}</td><td class="num">${fmtK(r.total)}</td><td class="num">${fmtK(r.running)}</td><td class="num">${r.count}</td></tr>`).join('');
  document.querySelector('#maturityTable tbody').innerHTML = rowsHtml || '<tr><td colspan="6" style="color:var(--sub);">No valid instruments for the schools in view.</td></tr>';
  document.querySelector('#maturityTable tfoot').innerHTML = `<tr class="total-row"><td>Grand total</td><td class="num">${fmtK(M.grand.pdc)}</td><td class="num">${fmtK(M.grand.pn)}</td><td class="num">${fmtK(M.grand.total)}</td><td class="num">—</td><td class="num">${M.grand.count}</td></tr>`;

  const expired = INSTRUMENTS[company].filter(i=>i.expired);
  const expTotal = expired.reduce((s,i)=>s+i.amount,0);
  const accounts = new Set(rows.map(r=>r.account));
  const unlinked = INSTRUMENTS[company].filter(i=>!i.expired && (!i.account || !accounts.has(i.account)));
  const unlinkedTotal = unlinked.reduce((s,i)=>s+i.amount,0);
  let note = `${expired.length} instrument(s) totalling SAR ${fmt(expTotal)} are marked Expired and are excluded everywhere.`;
  if(state.group==='all' && state.rep==='all' && unlinked.length>0){
    note += ` A further ${unlinked.length} valid instrument(s) worth SAR ${fmt(unlinkedTotal)} belong to accounts with no current outstanding balance (typically advance prepayments) and are not shown here.`;
  }
  document.getElementById('maturityNote').textContent = note;
}

function renderCustomerTable(baseRows, isDebit){
  let rows = baseRows;
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    rows = rows.filter(r=>r.name.toLowerCase().includes(q));
  }
  rows = [...rows].sort((a,b)=>{
    const k = state.sortKey; let av=a[k], bv=b[k];
    if(typeof av==='string'){ av=av.toLowerCase(); bv=(bv||'').toLowerCase(); } else { av=av||0; bv=bv||0; }
    if(av<bv) return state.sortDir==='asc'?-1:1;
    if(av>bv) return state.sortDir==='asc'?1:-1;
    return 0;
  });
  const cell = v => `<td class="num ${v<0?'neg':''}">${v?fmtSigned(v):'<span class="zero">—</span>'}</td>`;
  document.querySelector('#customerTable tbody').innerHTML = rows.map(r=>`
    <tr><td class="name">${r.name}</td><td class="dim">${r.group}</td><td class="dim">${r.rep}</td>

      <td class="num">${r.pdc?fmt(r.pdc):'<span class="zero">—</span>'}</td>` : ''}
      <td class="num sep ${r.b1_60<0?'neg':''}">${r.b1_60?fmtSigned(r.b1_60):'<span class="zero">—</span>'}</td>

      <td class="note">${r.note||''}</td></tr>`).join('');
  document.getElementById('rowCount').textContent = rows.length + ' row' + (rows.length===1?'':'s');
  const T = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  document.querySelector('#customerTable tfoot').innerHTML = `
    <tr class="total-row"><td>Total</td><td></td><td></td>

    const key = th.dataset.key; const base = th.textContent.replace(/[▲▼]\s*$/,'').trim();
    th.innerHTML = base + (state.sortKey===key ? ` <span class="arrow">${state.sortDir==='asc'?'▲':'▼'}</span>` : '');
  });
}

function buildDashboard(){
  const main = document.getElementById('mainContent');
  const isDebit = state.balanceType === 'debit';

  html += sectionKpi();

  else { html += sectionAged(); }

  wireDashboardEvents();

function renderDashboard(){
  const isDebit = state.balanceType === 'debit';
  const hasGroups = DATA[state.company].meta.hasGroups;
  const rows = currentRows().filter(matchesFilter);
  renderKpi(rows, isDebit);

function wireDashboardEvents(){
  const scope = document.getElementById('schoolsScope');
  if(scope){
    scope.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.schoolsScope = btn.dataset.val;
        scope.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
        renderSchools(currentRows().filter(matchesFilter));
      });
    });
  }
  document.getElementById('searchBox').addEventListener('input', e=>{ state.search = e.target.value; const isDebit = state.balanceType==='debit'; renderCustomerTable(currentRows().filter(matchesFilter), isDebit); });
  document.querySelectorAll('#customerTable th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(state.sortKey===key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; } else { state.sortKey = key; state.sortDir = key==='balance'?'desc':'asc'; }
      renderCustomerTable(currentRows().filter(matchesFilter), state.balanceType==='debit');
    });
  });
}

// ---------- Data & Notes page ----------
function buildNotesPage(){
  const main = document.getElementById('mainContent');
  const rows = effectiveDebitRows(state.company).filter(r => state.rep==='all' || (r.rep||'').toLowerCase()===state.rep.toLowerCase());
  let html = `
  <section class="panel">
    <h2>Data &amp; notes — ${state.company} schools</h2>
    <p class="panel-sub">Record actual collections and choose which schools appear in the report. Saved locally in this browser only.</p>
    <div class="notes-banner">
      These entries are stored in your browser's local storage — they will not automatically appear for other people opening this file elsewhere.
      Use export / import below to move your notes to another device or share them with a colleague.
    </div>
    <div class="notes-actions" style="margin-bottom:16px;">
      <button class="btn small" id="exportNotesBtn" type="button">Export notes (.json)</button>
      <button class="btn small" id="importNotesBtn" type="button">Import notes (.json)</button>
      <input type="file" id="importNotesFile" accept="application/json" style="display:none;">
    </div>
    <div id="schoolList"></div>
  </section>`;
  main.innerHTML = html;

  const list = document.getElementById('schoolList');
  list.innerHTML = rows.map(r=>{
    const note = getNote(state.company, r.account);
    const collTotal = note.collections.reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
    const adj = Math.max(r.balance - collTotal, 0);
    return `
    <div class="school-row ${note.included?'':'excluded'}" data-account="${r.account}">
      <div class="school-head">
        <div>
          <div class="school-name">${r.name}</div>
          <div class="school-meta">${r.group} · ${r.rep}</div>
        </div>
        <div class="school-figs">
          <div><span>Original</span>${fmt(r.balance)}</div>
          <div><span>Recorded</span>${fmt(collTotal)}</div>
          <div><span>Adjusted</span>${fmt(adj)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <label class="include-toggle"><input type="checkbox" class="incChk" ${note.included?'checked':''}> Show in report</label>
          <button class="btn small addCollBtn" type="button">+ Add collection</button>
        </div>
      </div>
      <div class="collections-list">
        ${note.collections.map((c,i)=>`<div class="collection-chip"><span>${c.date||'—'} · SAR ${fmt(parseFloat(c.amount)||0)} ${c.note?('· '+escapeHtml(c.note)):''}</span><button class="delCollBtn" data-idx="${i}">×</button></div>`).join('')}
      </div>
      <div class="add-collection-form">
        <input type="date" class="cDate" value="2026-07-01">
        <input type="number" class="cAmount" placeholder="Amount (SAR)" step="0.01" style="width:130px;">
        <input type="text" class="cNote" placeholder="Note (optional)" style="width:180px;">
        <button class="btn small saveCollBtn" type="button">Save</button>
      </div>
      <div class="school-memo">
        ${note.memo
          ? `<div class="memo-text">${escapeHtml(note.memo)}</div><button class="btn small editMemoBtn" type="button">Edit note</button>`
          : `<button class="btn small addMemoBtn" type="button">+ Add note</button>`}
        <div class="memo-form">
          <textarea class="memoInput" rows="2" placeholder="Add a note about this school…">${escapeHtml(note.memo||'')}</textarea>
          <button class="btn small saveMemoBtn" type="button">Save note</button>
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.school-row').forEach(row=>{
    const account = row.dataset.account;
    row.querySelector('.incChk').addEventListener('change', e=>{ setIncluded(state.company, account, e.target.checked); row.classList.toggle('excluded', !e.target.checked); });
    row.querySelector('.addCollBtn').addEventListener('click', ()=>{ row.querySelector('.add-collection-form').classList.toggle('open'); });
    row.querySelector('.saveCollBtn').addEventListener('click', ()=>{
      const date = row.querySelector('.cDate').value;
      const amount = parseFloat(row.querySelector('.cAmount').value);
      const note = row.querySelector('.cNote').value;
      if(!amount || amount<=0){ return; }
      addCollection(state.company, account, {date, amount, note});
      buildNotesPage();
    });
    row.querySelectorAll('.delCollBtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ removeCollection(state.company, account, parseInt(btn.dataset.idx)); buildNotesPage(); });
    });
    const memoForm = row.querySelector('.memo-form');
    const editBtn = row.querySelector('.editMemoBtn'); if(editBtn) editBtn.addEventListener('click', ()=> memoForm.classList.toggle('open'));
    const addBtn = row.querySelector('.addMemoBtn'); if(addBtn) addBtn.addEventListener('click', ()=> memoForm.classList.toggle('open'));
    row.querySelector('.saveMemoBtn').addEventListener('click', ()=>{
      const text = row.querySelector('.memoInput').value.trim();
      setMemo(state.company, account, text);
      buildNotesPage();
    });
  });

  document.getElementById('exportNotesBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(NOTES, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ar-dashboard-notes.json'; a.click();
  });
  document.getElementById('importNotesBtn').addEventListener('click', ()=> document.getElementById('importNotesFile').click());
  document.getElementById('importNotesFile').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ try{ NOTES = JSON.parse(reader.result); saveNotes(NOTES); buildNotesPage(); }catch(err){} };
    reader.readAsText(file);
  });
}

// ---------- top-level wiring ----------
function renderView(){
  document.getElementById('brandLogo').src = LOGOS[state.company];
  document.getElementById('brandLogo').alt = state.company + ' logo';
  populateFilters();
  const toolbar = document.getElementById('toolbar');
  const balanceGroup = document.getElementById('balanceGroup');
  const statusLine = document.getElementById('statusLine');
  if(state.view === 'notes'){
    balanceGroup.style.display = 'none';
    document.getElementById('groupFilterWrap').style.display = 'none';
    statusLine.style.display = 'none';
    buildNotesPage();
  } else {
    balanceGroup.style.display = '';
    statusLine.style.display = '';
    document.getElementById('statusCompany').textContent = state.company;
    document.getElementById('statusType').textContent = state.balanceType==='debit' ? 'Debit balances (Accounts Receivable)' : 'Credit balances (Advances / unallocated)';
    buildDashboard();
  }
}

document.querySelectorAll('.nav-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); state.view = btn.dataset.val; renderView();
  });
});
document.querySelectorAll('#companySeg button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#companySeg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); state.company = btn.dataset.val; state.group='all'; state.rep='all'; state.search='';
    renderView();
  });
});
document.getElementById('balanceToggle').addEventListener('click', function(){
  state.balanceType = state.balanceType==='debit' ? 'credit' : 'debit';
  this.textContent = state.balanceType==='debit' ? 'Debit balances' : 'Credit balances';
  this.classList.toggle('credit-active', state.balanceType==='credit');
  renderView();
});
document.getElementById('groupFilter').addEventListener('change', e=>{ state.group = e.target.value; if(state.view==='dashboard') renderDashboard(); else buildNotesPage(); });
document.getElementById('repFilter').addEventListener('change', e=>{ state.rep = e.target.value; if(state.view==='dashboard') renderDashboard(); else buildNotesPage(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{ state.group='all'; state.rep='all'; state.search=''; renderView(); });
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const next = theme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('ar-dashboard-theme', next); }catch(e){}
  renderView();
});
document.getElementById('printBtn').addEventListener('click', ()=>{ window.print(); });
let printOpenedDetails = [];
window.addEventListener('beforeprint', ()=>{
  printOpenedDetails = Array.from(document.querySelectorAll('.details-block:not([open])'));
  printOpenedDetails.forEach(d=>d.setAttribute('open',''));
});
window.addEventListener('afterprint', ()=>{
  printOpenedDetails.forEach(d=>d.removeAttribute('open'));
  printOpenedDetails = [];
});
(function initTheme(){
  let saved = null; try{ saved = localStorage.getItem('ar-dashboard-theme'); }catch(e){}
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');
})();

renderView();
</script>
</body>
</html>
